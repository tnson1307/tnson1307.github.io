<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fresh Air</title>
  <style>
    :root {
      --ink: #16352f;
      --muted: #3d5c56;
      --accent: #2f7a6b;
      --card: rgba(255, 255, 255, 0.72);
      --line: rgba(22, 53, 47, 0.12);
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 12% -10%, #fff6d4 0%, transparent 55%),
        linear-gradient(180deg, #9fd4e8 0%, #e8f4f2 42%, #f3efe0 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px 28px;
      text-align: center;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.2rem;
      margin: 0 0 8px;
    }
    p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
    a {
      display: inline-block;
      margin: 6px 10px;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Fresh Air</h1>
    <p>One task. Soft sky. Begin gently.</p>
    <a href="./privacy.html">Privacy Policy</a>
    <a href="./terms.html">Terms of Use</a>
    <a href="https://github.com/tnson1307/freshair">GitHub</a>
  </div>
</body>
</html>
